name: Build and deploy wedding app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wedding-app-deployment
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PAGES_DEPLOY_KEY }}

      - name: Trust GitHub's SSH host key
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Publish dist to GitHub Pages repository
        env:
          PAGES_REPOSITORY: git@github.com:mooujarrar/mooujarrar.github.io.git
          PAGES_BRANCH: save-the-date
        run: |
          git clone --depth 1 --branch "$PAGES_BRANCH" "$PAGES_REPOSITORY" pages-repo
          find pages-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. pages-repo/
          cd pages-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No deployment changes to publish."
          else
            git commit -m "Deploy wedding app from ${GITHUB_SHA::7}"
            git push origin "$PAGES_BRANCH"
          fi